<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yug Future Solutions — Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #17202a;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 20px;
    }

    .header {
      background: #111827;
      color: white;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .header h1 {
      margin: 0;
      font-size: 21px;
    }

    .header span {
      color: #9ca3af;
      font-size: 13px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 22px;
      margin-top: 20px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.06);
    }

    .login-box {
      max-width: 430px;
      margin: 70px auto;
    }

    h2 {
      margin-top: 0;
    }

    label {
      display: block;
      font-weight: 600;
      margin: 14px 0 7px;
      font-size: 14px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #2563eb;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 11px 17px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
    }

    .primary {
      background: #111827;
      color: white;
      width: 100%;
      margin-top: 18px;
    }

    .primary:hover {
      background: #000;
    }

    .secondary {
      background: #e5e7eb;
      color: #111827;
    }

    .danger {
      background: #dc2626;
      color: white;
    }

    .edit {
      background: #2563eb;
      color: white;
    }

    .logout {
      background: #dc2626;
      color: white;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 15px;
    }

    .checkbox-row input {
      width: auto;
    }

    .form-buttons {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }

    .form-buttons button {
      width: auto;
    }

    .product {
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 15px;
      margin-top: 12px;
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .product img {
      width: 100px;
      height: 85px;
      object-fit: cover;
      border-radius: 8px;
      background: #f3f4f6;
    }

    .product-info {
      flex: 1;
    }

    .product-info h3 {
      margin: 0 0 5px;
      font-size: 17px;
    }

    .product-info p {
      margin: 4px 0;
      font-size: 13px;
      color: #6b7280;
    }

    .badge {
      display: inline-block;
      background: #eef2ff;
      color: #3730a3;
      padding: 4px 8px;
      border-radius: 20px;
      font-size: 12px;
      margin-right: 5px;
    }

    .actions {
      display: flex;
      gap: 7px;
    }

    .message {
      margin-top: 12px;
      padding: 10px;
      border-radius: 8px;
      display: none;
      font-size: 14px;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .preview {
      width: 130px;
      height: 100px;
      object-fit: cover;
      border-radius: 8px;
      margin-top: 10px;
      display: none;
    }

    #adminPanel {
      display: none;
    }

    @media (max-width: 700px) {
      .row {
        grid-template-columns: 1fr;
      }

      .product {
        align-items: flex-start;
        flex-direction: column;
      }

      .product img {
        width: 100%;
        height: 180px;
      }

      .actions {
        width: 100%;
      }

      .actions button {
        flex: 1;
      }

      .header {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <!-- LOGIN -->
  <div id="loginSection" class="container">
    <div class="card login-box">

      <h2>YUG FUTURE SOLUTIONS</h2>
      <p>Admin Login</p>

      <label>Email</label>
      <input type="email" id="loginEmail" placeholder="Admin email">

      <label>Password</label>
      <input type="password" id="loginPassword" placeholder="Password">

      <button class="primary" onclick="login()">
        Login
      </button>

      <div id="loginMessage" class="message"></div>

    </div>
  </div>


  <!-- ADMIN PANEL -->
  <div id="adminPanel">

    <div class="header">
      <div>
        <h1>YUG FUTURE SOLUTIONS</h1>
        <span>Product Management Panel</span>
      </div>

      <button class="logout" onclick="logout()">
        Logout
      </button>
    </div>


    <div class="container">

      <!-- ADD / EDIT PRODUCT -->
      <div class="card">

        <h2 id="formTitle">Add Product</h2>

        <input type="hidden" id="productId">
        <input type="hidden" id="existingImageUrl">

        <label>Product Name *</label>
        <input
          type="text"
          id="productName"
          placeholder="Example: LG 1.5 Ton Split AC"
        >

        <div class="row">

          <div>
            <label>Category *</label>

            <select id="category">
              <option value="">Select Category</option>
              <option>Air Conditioner</option>
              <option>Refrigerator</option>
              <option>Washing Machine</option>
              <option>Air Cooler</option>
              <option>Oven</option>
              <option>Dishwasher</option>
              <option>Air Fryer</option>
              <option>More Electronics</option>
            </select>
          </div>

          <div>
            <label>Brand</label>

            <select id="brand">
              <option value="">Select Brand</option>
              <option>Lloyd</option>
              <option>Intex</option>
              <option>LG</option>
              <option>Carrier</option>
              <option>Samsung</option>
              <option>IFB</option>
              <option>Bosch</option>
              <option>Godrej</option>
              <option>Whirlpool</option>
              <option>Haier</option>
              <option>Midea</option>
              <option>Daikin</option>
              <option>Voltas</option>
              <option>Blue Star</option>
              <option>Philips</option>
              <option>Pigeon</option>
              <option>Inalsa</option>
              <option>Havells</option>
              <option>Wipro</option>
              <option>Other</option>
            </select>
          </div>

        </div>


        <div class="row">

          <div>
            <label>Condition</label>

            <select id="condition">
              <option value="D1">D1 — Fresh / Clean</option>
              <option value="D2">D2 — Open Box / Cosmetic Marks</option>
            </select>
          </div>

          <div>
            <label>Status</label>

            <select id="status">
              <option value="available">Available</option>
              <option value="sold_out">Sold Out</option>
            </select>
          </div>

        </div>


        <div class="row">

          <div>
            <label>Price (₹)</label>

            <input
              type="number"
              id="price"
              placeholder="Example: 24999"
            >
          </div>

          <div>
            <label>Product Image</label>

            <input
              type="file"
              id="productImage"
              accept="image/*"
              onchange="previewImage(event)"
            >

            <img id="imagePreview" class="preview">
          </div>

        </div>


        <label>Description</label>

        <textarea
          id="description"
          placeholder="Product details, capacity, features, warranty etc."
        ></textarea>


        <div class="checkbox-row">
          <input type="checkbox" id="showPrice">
          <label for="showPrice" style="margin:0;">
            Show price on website
          </label>
        </div>


        <div class="form-buttons">

          <button class="primary" onclick="saveProduct()" id="saveButton">
            Add Product
          </button>

          <button
            class="secondary"
            onclick="resetForm()"
            id="cancelButton"
            style="display:none;"
          >
            Cancel Edit
          </button>

        </div>

        <div id="formMessage" class="message"></div>

      </div>


      <!-- PRODUCT LIST -->

      <div class="card">

        <h2>Your Products</h2>

        <div id="productsList">
          Loading products...
        </div>

      </div>

    </div>

  </div>


<script>

  /* ==============================
     SUPABASE CONNECTION
  ============================== */

  const SUPABASE_URL =
    "https://qzpxayekzcnmbqtjoqrg.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable__0yuI-P-8-QUo6M6RhdKCw_pxWHCEOF";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* ==============================
     LOGIN
  ============================== */

  async function login() {

    const email =
      document.getElementById("loginEmail").value.trim();

    const password =
      document.getElementById("loginPassword").value;

    const message =
      document.getElementById("loginMessage");

    message.style.display = "none";

    if (!email || !password) {

      showMessage(
        message,
        "Please enter email and password.",
        "error"
      );

      return;
    }

    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

    if (error) {

      showMessage(
        message,
        error.message,
        "error"
      );

      return;
    }

    showAdminPanel();

  }


  /* ==============================
     LOGOUT
  ============================== */

  async function logout() {

    await supabaseClient.auth.signOut();

    document.getElementById("adminPanel").style.display = "none";
    document.getElementById("loginSection").style.display = "block";

  }


  /* ==============================
     SESSION CHECK
  ============================== */

  async function checkSession() {

    const { data } =
      await supabaseClient.auth.getSession();

    if (data.session) {

      showAdminPanel();

    } else {

      document.getElementById("loginSection").style.display = "block";
      document.getElementById("adminPanel").style.display = "none";

    }

  }


  function showAdminPanel() {

    document.getElementById("loginSection").style.display = "none";
    document.getElementById("adminPanel").style.display = "block";

    loadProducts();

  }


  /* ==============================
     LOAD PRODUCTS
  ============================== */

  async function loadProducts() {

    const container =
      document.getElementById("productsList");

    container.innerHTML = "Loading products...";

    const { data, error } =
      await supabaseClient
        .from("Products")
        .select("*")
        .order("created_at", {
          ascending: false
        });

    if (error) {

      container.innerHTML =
        "<p>Unable to load products: " +
        escapeHtml(error.message) +
        "</p>";

      return;
    }

    if (!data || data.length === 0) {

      container.innerHTML =
        "<p>No products added yet.</p>";

      return;
    }

    container.innerHTML = "";

    data.forEach(product => {

      const div =
        document.createElement("div");

      div.className = "product";

      let imageHTML = "";

      if (product.image_url) {

        imageHTML =
          `<img src="${escapeAttribute(product.image_url)}" alt="">`;

      } else {

        imageHTML =
          `<img src="" alt="No image">`;

      }


      let priceHTML = "";

      if (
        product.show_price &&
        product.price !== null
      ) {

        priceHTML =
          `<strong>₹${Number(product.price).toLocaleString("en-IN")}</strong>`;

      }


      div.innerHTML = `

        ${imageHTML}

        <div class="product-info">

          <h3>${escapeHtml(product.name || "")}</h3>

          <span class="badge">
            ${escapeHtml(product.brand || "Other")}
          </span>

          <span class="badge">
            ${escapeHtml(product.category || "")}
          </span>

          <span class="badge">
            ${escapeHtml(product.condition || "")}
          </span>

          <p>${escapeHtml(product.description || "")}</p>

          <p>
            ${priceHTML}
            &nbsp;
            Status:
            ${product.status === "available"
              ? "Available"
              : "Sold Out"}
          </p>

        </div>

        <div class="actions">

          <button
            class="edit"
            onclick="editProduct(${product.id})"
          >
            Edit
          </button>

          <button
            class="danger"
            onclick="deleteProduct(${product.id})"
          >
            Delete
          </button>

        </div>

      `;

      container.appendChild(div);

    });

  }


  /* ==============================
     SAVE PRODUCT
  ============================== */

  async function saveProduct() {

    const productId =
      document.getElementById("productId").value;

    const name =
      document.getElementById("productName").value.trim();

    const category =
      document.getElementById("category").value;

    const brand =
      document.getElementById("brand").value;

    const condition =
      document.getElementById("condition").value;

    const status =
      document.getElementById("status").value;

    const priceValue =
      document.getElementById("price").value;

    const description =
      document.getElementById("description").value.trim();

    const showPrice =
      document.getElementById("showPrice").checked;

    const imageFile =
      document.getElementById("productImage").files[0];

    const existingImageUrl =
      document.getElementById("existingImageUrl").value;


    if (!name || !category) {

      showMessage(
        document.getElementById("formMessage"),
        "Product name and category are required.",
        "error"
      );

      return;
    }


    const saveButton =
      document.getElementById("saveButton");

    saveButton.disabled = true;
    saveButton.textContent = "Saving...";


    try {

      let imageUrl = existingImageUrl;


      /* ==============================
         IMAGE UPLOAD
      ============================== */

      if (imageFile) {

        const fileExtension =
          imageFile.name.split(".").pop();

        const fileName =
          Date.now() +
          "-" +
          Math.random()
            .toString(36)
            .substring(2, 8) +
          "." +
          fileExtension;

        const filePath =
          "products/" + fileName;


        const { error: uploadError } =
          await supabaseClient.storage
            .from("product-images")
            .upload(
              filePath,
              imageFile,
              {
                cacheControl: "3600",
                upsert: false
              }
            );


        if (uploadError) {

          throw new Error(
            "Image upload failed: " +
            uploadError.message
          );

        }


        const { data: publicUrlData } =
          supabaseClient.storage
            .from("product-images")
            .getPublicUrl(filePath);


        imageUrl =
          publicUrlData.publicUrl;

      }


      /* ==============================
         PRODUCT DATA
      ============================== */

      const productData = {

        name: name,

        category: category,

        brand: brand,

        condition: condition,

        description: description,

        price:
          priceValue === ""
            ? null
            : Number(priceValue),

        show_price: showPrice,

        status: status,

        image_url: imageUrl || null

      };


      /* ==============================
         UPDATE
      ============================== */

      if (productId) {

        const { error } =
          await supabaseClient
            .from("Products")
            .update(productData)
            .eq("id", productId);

        if (error) {

          throw error;

        }


        showMessage(
          document.getElementById("formMessage"),
          "Product updated successfully.",
          "success"
        );

      }


      /* ==============================
         INSERT
      ============================== */

      else {

        const { error } =
          await supabaseClient
            .from("Products")
            .insert([productData]);

        if (error) {

          throw error;

        }


        showMessage(
          document.getElementById("formMessage"),
          "Product added successfully.",
          "success"
        );

      }


      resetForm(false);

      await loadProducts();

    }

    catch (error) {

      showMessage(
        document.getElementById("formMessage"),
        error.message,
        "error"
      );

    }

    finally {

      saveButton.disabled = false;

      saveButton.textContent =
        productId
          ? "Update Product"
          : "Add Product";

    }

  }


  /* ==============================
     EDIT PRODUCT
  ============================== */

  async function editProduct(id) {

    const { data, error } =
      await supabaseClient
        .from("Products")
        .select("*")
        .eq("id", id)
        .single();

    if (error) {

      alert(error.message);
      return;

    }


    document.getElementById("productId").value =
      data.id;

    document.getElementById("existingImageUrl").value =
      data.image_url || "";

    document.getElementById("productName").value =
      data.name || "";

    document.getElementById("category").value =
      data.category || "";

    document.getElementById("brand").value =
      data.brand || "";

    document.getElementById("condition").value =
      data.condition || "D1";

    document.getElementById("status").value =
      data.status || "available";

    document.getElementById("price").value =
      data.price ?? "";

    document.getElementById("description").value =
      data.description || "";

    document.getElementById("showPrice").checked =
      data.show_price === true;


    if (data.image_url) {

      const preview =
        document.getElementById("imagePreview");

      preview.src =
        data.image_url;

      preview.style.display =
        "block";

    }


    document.getElementById("formTitle").textContent =
      "Edit Product";

    document.getElementById("saveButton").textContent =
      "Update Product";

    document.getElementById("cancelButton").style.display =
      "block";


    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }


  /* ==============================
     DELETE PRODUCT
  ============================== */

  async function deleteProduct(id) {

    const confirmed =
      confirm(
        "Are you sure you want to delete this product?"
      );

    if (!confirmed) return;


    const { error } =
      await supabaseClient
        .from("Products")
        .delete()
        .eq("id", id);


    if (error) {

      alert(
        "Delete failed: " +
        error.message
      );

      return;

    }


    await loadProducts();

  }


  /* ==============================
     RESET FORM
  ============================== */

  function resetForm(clearMessage = true) {

    document.getElementById("productId").value = "";

    document.getElementById("existingImageUrl").value = "";

    document.getElementById("productName").value = "";

    document.getElementById("category").value = "";

    document.getElementById("brand").value = "";

    document.getElementById("condition").value = "D1";

    document.getElementById("status").value = "available";

    document.getElementById("price").value = "";

    document.getElementById("description").value = "";

    document.getElementById("showPrice").checked = false;

    document.getElementById("productImage").value = "";

    document.getElementById("imagePreview").style.display = "none";

    document.getElementById("imagePreview").src = "";


    document.getElementById("formTitle").textContent =
      "Add Product";

    document.getElementById("saveButton").textContent =
      "Add Product";

    document.getElementById("cancelButton").style.display =
      "none";


    if (clearMessage) {

      document.getElementById("formMessage").style.display =
        "none";

    }

  }


  /* ==============================
     IMAGE PREVIEW
  ============================== */

  function previewImage(event) {

    const file =
      event.target.files[0];

    const preview =
      document.getElementById("imagePreview");

    if (!file) {

      preview.style.display = "none";
      return;

    }

    preview.src =
      URL.createObjectURL(file);

    preview.style.display =
      "block";

  }


  /* ==============================
     MESSAGE
  ============================== */

  function showMessage(element, text, type) {

    element.textContent = text;

    element.className =
      "message " + type;

    element.style.display =
      "block";

  }


  /* ==============================
     SECURITY / HTML ESCAPE
  ============================== */

  function escapeHtml(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  function escapeAttribute(value) {

    return escapeHtml(value);

  }


  /* ==============================
     START
  ============================== */

  checkSession();

</script>

</body>
</html>
